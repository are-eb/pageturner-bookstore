<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Manage Orders — Admin</title>
    <div th:replace="~{fragments :: head-assets}"></div>
</head>
<body class="bg-bone min-h-screen font-sans">

<div class="flex flex-col md:flex-row">
    <div th:replace="~{admin/fragments :: sidebar('orders')}"></div>

    <main class="flex-1 p-6 md:p-12">
        <div th:replace="~{fragments :: alerts}"></div>
        <p class="eyebrow text-ink40 mb-2">Fulfilment</p>
        <h1 class="font-display text-3xl mb-8">Manage Orders</h1>

        <div class="panel overflow-x-auto">
            <table class="w-full text-sm">
                <thead>
                <tr class="text-left border-b border-line bg-bone-2">
                    <th class="p-3.5 font-mono text-[0.6875rem] uppercase tracking-wide text-ink40">Order</th>
                    <th class="p-3.5 font-mono text-[0.6875rem] uppercase tracking-wide text-ink40">Customer</th>
                    <th class="p-3.5 font-mono text-[0.6875rem] uppercase tracking-wide text-ink40">Date</th>
                    <th class="p-3.5 font-mono text-[0.6875rem] uppercase tracking-wide text-ink40">Total</th>
                    <th class="p-3.5 font-mono text-[0.6875rem] uppercase tracking-wide text-ink40">Status</th>
                    <th class="p-3.5 font-mono text-[0.6875rem] uppercase tracking-wide text-ink40">Update</th>
                </tr>
                </thead>
                <tbody class="divide-y divide-line">
                <tr th:each="order : ${orders}">
                    <td class="p-3"><a th:href="@{/orders/{id}(id=${order.id})}" class="text-forest hover:underline font-mono text-xs" th:text="'#' + ${order.id}">#1</a></td>
                    <td class="p-3 text-ink" th:text="${order.user.name}">Name</td>
                    <td class="p-3 text-ink-70 text-xs" th:text="${#temporals.format(order.orderDate, 'MMM d, yyyy')}">Date</td>
                    <td class="p-3 price text-ink" th:text="${'$' + #numbers.formatDecimal(order.totalAmount,1,2)}">$0.00</td>
                    <td class="p-3">
                        <span class="badge"
                              th:classappend="${order.status.name() == 'DELIVERED'} ? 'badge-forest' :
                                              (${order.status.name() == 'CANCELLED'} ? 'badge-claret' : 'badge-brass')"
                              th:text="${order.status}">Status</span>
                    </td>
                    <td class="p-3">
                        <form th:action="@{/admin/orders/{id}/status(id=${order.id})}" method="post" class="flex gap-2">
                            <select name="status" class="field py-1.5 text-xs w-auto">
                                <option th:each="s : ${T(com.bookstore.app.model.OrderStatus).values()}"
                                        th:value="${s}" th:text="${s}" th:selected="${s == order.status}"></option>
                            </select>
                            <button class="btn btn-dark btn-sm">Update</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${orders == null or orders.isEmpty()}">
                    <td colspan="6" class="p-10 text-center text-ink-40">No orders yet.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>

</body>
</html>
