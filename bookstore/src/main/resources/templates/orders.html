<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>My Orders — Pageturner</title>
    <div th:replace="~{fragments :: head-assets}"></div>
</head>
<body class="bg-bone min-h-screen flex flex-col font-sans">

<div th:replace="~{fragments :: navbar}"></div>
<div th:replace="~{fragments :: alerts}"></div>

<main class="flex-1 max-w-4xl mx-auto px-5 sm:px-8 py-12 w-full">
    <p class="eyebrow text-ink40 mb-2">Account</p>
    <h1 class="font-display text-3xl sm:text-4xl mb-10 pb-6 border-b border-line">Order History</h1>

    <div th:if="${orders == null or orders.isEmpty()}" class="text-center py-24 panel border-dashed">
        <p class="font-display text-xl text-ink-70">No orders placed yet.</p>
        <a href="/books" class="btn btn-primary mt-6">Start shopping</a>
    </div>

    <div class="space-y-3" th:if="${orders != null and !orders.isEmpty()}">
        <a th:each="order : ${orders}" th:href="@{/orders/{id}(id=${order.id})}"
           class="flex items-center justify-between panel p-5 hover:border-forest transition-colors">
            <div>
                <p class="font-display text-lg" th:text="'Order #' + ${order.id}">Order #1</p>
                <p class="text-sm text-ink-70 mt-0.5" th:text="${#temporals.format(order.orderDate, 'MMM d, yyyy · h:mm a')}">Date</p>
            </div>
            <div class="text-right">
                <span class="badge"
                      th:classappend="${order.status.name() == 'DELIVERED'} ? 'badge-forest' :
                                      (${order.status.name() == 'CANCELLED'} ? 'badge-claret' : 'badge-brass')"
                      th:text="${order.status}">Status</span>
                <p class="price text-ink mt-2" th:text="${'$' + #numbers.formatDecimal(order.totalAmount,1,2)}">$0.00</p>
            </div>
        </a>
    </div>
</main>

<div th:replace="~{fragments :: footer}"></div>

</body>
</html>
