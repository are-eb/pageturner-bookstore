<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Create Account — Pageturner</title>
    <div th:replace="~{fragments :: head-assets}"></div>
</head>
<body class="bg-bone min-h-screen flex flex-col font-sans">

<div th:replace="~{fragments :: navbar}"></div>

<main class="flex-1 grid lg:grid-cols-2">
    <div class="hidden lg:flex flex-col justify-between bg-ink text-bone p-14 relative overflow-hidden" data-cursor-glow>
        <div class="absolute inset-0 opacity-[0.04]" style="background-image: repeating-linear-gradient(180deg, transparent, transparent 27px, currentColor 28px);"></div>
        <div class="relative">
            <p class="eyebrow text-brass mb-4">Join the catalog</p>
            <h2 class="font-display text-4xl leading-tight max-w-sm">Your library<br/>card starts<br/><span class="italic text-brass">right here.</span></h2>
        </div>
        <p class="relative text-white/40 text-sm font-mono">PAGETURNER — CATALOG NO. 001</p>
    </div>

    <div class="flex items-center justify-center px-6 py-16">
        <div class="w-full max-w-sm">
            <p class="eyebrow text-ink40 mb-2">New here</p>
            <h1 class="font-display text-3xl mb-1">Create your account</h1>
            <p class="text-sm text-ink-70 mb-8">Takes less than a minute.</p>

            <div th:if="${error}" class="badge badge-claret w-full py-2.5 mb-5 justify-center normal-case font-sans text-sm" th:text="${error}"></div>

            <form th:action="@{/register}" method="post" class="space-y-4">
                <div>
                    <label class="field-label">Full name</label>
                    <input type="text" name="name" th:value="${name}" required class="field"/>
                </div>
                <div>
                    <label class="field-label">Email</label>
                    <input type="email" name="email" th:value="${email}" required class="field"/>
                </div>
                <div>
                    <label class="field-label">Password</label>
                    <div class="relative">
                        <input type="password" name="password" id="register-password" required minlength="6" class="field pr-14"/>
                        <button type="button" data-password-toggle="register-password" class="absolute right-3 top-1/2 -translate-y-1/2 text-xs font-medium text-forest hover:underline">Show</button>
                    </div>
                </div>
                <div>
                    <label class="field-label">Address <span class="normal-case text-ink40">(optional)</span></label>
                    <input type="text" name="address" class="field"/>
                </div>
                <button class="btn btn-primary w-full">Create account</button>
            </form>

            <p class="text-sm text-ink-70 mt-7 text-center">
                Already have an account? <a href="/login" class="text-forest font-medium hover:underline">Sign in</a>
            </p>
        </div>
    </div>
</main>

</body>
</html>
