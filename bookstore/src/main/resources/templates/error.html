<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Something went wrong — Pageturner</title>
    <div th:replace="~{fragments :: head-assets}"></div>
</head>
<body class="bg-bone min-h-screen flex flex-col font-sans">

<div th:replace="~{fragments :: navbar}"></div>

<main class="flex-1 flex items-center justify-center px-6 py-24">
    <div class="text-center max-w-md">
        <p class="eyebrow text-brass mb-4">Catalog Error</p>
        <h1 class="font-display text-4xl text-ink mb-3">This page misfiled itself.</h1>
        <p class="text-ink-70" th:text="${message != null ? message : 'The page you requested could not be found.'}">Error</p>
        <a href="/" class="btn btn-primary mt-8">Back to the shelves</a>
    </div>
</main>

<div th:replace="~{fragments :: footer}"></div>

</body>
</html>
