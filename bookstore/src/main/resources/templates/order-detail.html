<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="'Order #' + ${order.id} + ' — Pageturner'">Order — Pageturner</title>
    <div th:replace="~{fragments :: head-assets}"></div>
</head>
<body class="bg-bone min-h-screen flex flex-col font-sans">

<div th:replace="~{fragments :: navbar}"></div>
<div th:replace="~{fragments :: alerts}"></div>

<main class="flex-1 max-w-3xl mx-auto px-5 sm:px-8 py-12 w-full">
    <a href="/orders" class="inline-flex items-center gap-1.5 text-sm text-ink-70 hover:text-forest transition-colors">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
        Back to orders
    </a>

    <div class="mt-6 panel p-7 sm:p-8">
        <div class="flex items-start justify-between mb-2">
            <div>
                <p class="eyebrow text-ink40 mb-1">Receipt</p>
                <h1 class="font-display text-2xl" th:text="'Order #' + ${order.id}">Order</h1>
            </div>
            <span class="badge"
                  th:classappend="${order.status.name() == 'DELIVERED'} ? 'badge-forest' :
                                  (${order.status.name() == 'CANCELLED'} ? 'badge-claret' : 'badge-brass')"
                  th:text="${order.status}">Status</span>
        </div>

        <p class="text-sm text-ink-70 mt-4" th:text="'Placed ' + ${#temporals.format(order.orderDate, 'MMMM d, yyyy · h:mm a')}">Date</p>
        <p class="text-sm text-ink-70" th:text="'Shipping to ' + ${order.shippingAddress}">Address</p>

        <div class="divide-y divide-line border-y border-line mt-6">
            <div th:each="item : ${order.items}" class="flex justify-between py-3 text-sm">
                <span class="text-ink" th:text="${item.book.title} + ' × ' + ${item.quantity}">Item</span>
                <span class="price text-ink" th:text="${'$' + #numbers.formatDecimal(item.priceAtPurchase * item.quantity,1,2)}">$0.00</span>
            </div>
        </div>

        <div class="flex justify-between pt-5 mt-2">
            <span class="font-display text-lg">Total</span>
            <span class="price text-forest text-xl" th:text="${'$' + #numbers.formatDecimal(order.totalAmount,1,2)}">$0.00</span>
        </div>
    </div>
</main>

<div th:replace="~{fragments :: footer}"></div>

</body>
</html>
