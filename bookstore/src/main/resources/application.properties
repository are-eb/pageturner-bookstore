spring.application.name=bookstore

server.port=8080

# ---- H2 file-based database (free, zero-setup, persists in ./data folder) ----
spring.datasource.url=jdbc:h2:file:./data/bookstore;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# ---- Google Books API ----
# Public search works without a key (rate-limited by IP).
# For higher quotas, get a FREE key at https://console.cloud.google.com/apis/library/books.googleapis.com
# and paste it below.
google.books.api.key=AIzaSyDWvsqMDRwYUnCgeEuhFq1WNJPEFp_n8mo
google.books.api.base-url=https://www.googleapis.com/books/v1/volumes

# ---- File upload (cover image uploads, if used) ----
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ---- Thymeleaf ----
spring.thymeleaf.cache=false

logging.level.org.springframework.security=INFO
